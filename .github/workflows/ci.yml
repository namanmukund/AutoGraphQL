name: AutoGraphQL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} - Test & Governance Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: pgtest
          POSTGRES_PASSWORD: pgtest123
          POSTGRES_DB: autographql_pg_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pgtest -d autographql_pg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test

      - name: Validate Schema Dump
        run: npm run schema:dump

      - name: Run Schema Governance Diff
        run: npm run schema:diff -- --base schema.graphql

      - name: Verify TypeScript SDK Generation
        run: npm run codegen:sdk

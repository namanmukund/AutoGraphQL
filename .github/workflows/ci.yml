name: AutoGraphQL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} - Test & Governance Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test

      - name: Validate Schema Dump
        run: npm run schema:dump

      - name: Run Schema Governance Diff
        run: npm run schema:diff -- --base schema.graphql

      - name: Verify TypeScript SDK Generation
        run: npm run codegen:sdk

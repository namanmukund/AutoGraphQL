# serverless.yml

service: tekie-backend

provider:
  name: aws
  runtime: nodejs12.x
  timeout: 30
  stage: staging
  region: us-east-1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - '*'
      Resource: "arn:aws:s3:::tekie-tms-test/*"
    - Effect: Allow
      Action:
        - s3:*
      Resource: "arn:aws:s3:::tekie-tms-test/*"
    - Effect: "Allow"
      Action:
        - "s3:getSignedUrl"
      Resource: "arn:aws:s3:::tekie-tms-test/*"
    - Effect: "Allow"
      Action:
        - "s3:PutObject"
      Resource: "arn:aws:s3:::tekie-tms-test/*"
functions:
  app:
    handler: src/serverlessApp.handler # reference the file and exported method
    events: # events trigger lambda functions
      - http: # this is an API Gateway HTTP event trigger
          path: /graphql/core
          method: ANY
          cors: true
      - http: # all routes get proxied to the Express router
          path: /graphql/core/{proxy+}
          method: ANY
          cors: true
plugins:
  - serverless-webpack
  - serverless-offline
custom:
  webpack:
    webpackConfig: /webpack/webpack.serverless.cloudProd.js
  webpackIncludeModules:
    packagePath: './package.json'
